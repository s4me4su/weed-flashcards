<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Base href: change this if the app is served from a sub-path, e.g.
    "/weeds/" for GitHub Pages project sites. `build_web.ps1 -BaseHref /weeds/`
    rewrites this for you.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Swipe flashcards for weed identification - 45 cards from the scanned booklet, no names on the front, flip for the answer.">

  <!-- Theme / installable PWA (iPhone: Share -> Add to Home Screen) -->
  <meta name="theme-color" content="#12150F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Weed ID">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Weed ID Trainer</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #12150F; }

    /* Splash shown while main.dart.js and the first card download. */
    #splash {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #12150F; color: #f5f5f5;
      font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: opacity .3s ease;
    }
    #splash img { width: 108px; height: 108px; border-radius: 24px; }
    #splash .bar { width: 150px; height: 3px; border-radius: 3px; background: #232a1c; overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; background: #4CAF50;
                     animation: slide 1.1s ease-in-out infinite; }
    #splash small { color: #8b9184; font-weight: 400; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(375%); } }
    /* Older Flutter versions marked the first frame on <body>; newer ones
       don't, so the script below also watches for the flutter-view element. */
    body.flutter-first-frame #splash { display: none; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div>Weed ID Trainer</div>
    <div class="bar"><i></i></div>
    <small>Loading the deck&hellip;</small>
  </div>

  <script>
    // Fade the splash out once Flutter has attached its view (the page
    // background is the same colour, so the handover is invisible).
    (function () {
      var splash = document.getElementById('splash'), tries = 0;
      var timer = setInterval(function () {
        if (document.querySelector('flutter-view') || ++tries > 600) {
          clearInterval(timer);
          splash.style.opacity = '0';
          setTimeout(function () { splash.remove(); }, 320);
        }
      }, 100);
    })();
  </script>

  <script>
    // Offline support: see app_service_worker.js. Registered after load so it
    // never competes with the first paint.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('app_service_worker.js')
          .catch(function () { /* private mode / unsupported: the app still works */ });
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
